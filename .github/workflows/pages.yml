name: pages

# Deploys demo/ (the ziano site) to GitHub Pages.
# Served at https://<owner>.github.io/ziano/ — VITE_BASE must match the repo
# name. When the hanzi.pro custom domain lands, swap VITE_BASE accordingly.

on:
  push:
    branches: [main, demo]
    paths:
      - "demo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # bun over pnpm: pnpm v11's supply-chain policy hard-fails on esbuild's
      # postinstall (ERR_PNPM_IGNORED_BUILDS); bun's approval is the
      # trustedDependencies field the demo already ships.
      - uses: oven-sh/setup-bun@v2

      - name: Install
        working-directory: demo
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: demo
        run: bun run build
        env:
          VITE_BASE: /ziano/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
