name: pages

# Deploys demo/ (the ziano site) to GitHub Pages.
# Served at https://<owner>.github.io/ziano/ — VITE_BASE must match the repo
# name. When the hanzi.pro custom domain lands, swap VITE_BASE accordingly.

on:
  push:
    branches: [main, demo]
    paths:
      - "demo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: demo/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: demo/pnpm-lock.yaml

      - name: Install
        working-directory: demo
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: demo
        run: pnpm build
        env:
          VITE_BASE: /ziano/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
