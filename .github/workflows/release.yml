name: release

# Build every roster family and publish its @hanzi.pro/webfonts-* package to npm.
# Stable tags (v1.2.3) publish to the default `latest` dist-tag; the manual
# scripts/publish-rc.sh path stays for `rc` rounds.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install build deps
        run: pip install -e .

      - name: Build every roster family (fetches sources, writes dist/<id>/)
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          PYTHONPATH=src python - "$VERSION" <<'PY'
          import sys, tomllib
          from ziano.build import build_family
          version = sys.argv[1]
          families = tomllib.load(open("roster.toml", "rb"))["family"]
          for fam in families:
              fid = fam["id"]
              print(f"→ build {fid}@{version}", flush=True)
              build_family(fid, roster_path="roster.toml", dest="dist", version=version)
          PY

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: webfonts-dist
          path: dist/
          if-no-files-found: error

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write   # required for `npm publish --provenance` (Sigstore OIDC)
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"   # publish stays npm, not bun: --provenance needs the npm CLI
          registry-url: "https://registry.npmjs.org"

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: webfonts-dist
          path: dist/

      - name: Publish every package to npm (latest dist-tag)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          failed=()
          for dir in dist/*/; do
            [ -f "$dir/package.json" ] || continue
            name=$(node -p "require('./$dir/package.json').name")
            echo "→ publishing $name"
            ( cd "$dir" && npm publish --provenance --access public ) \
              && echo "  ✓ $name" \
              || { echo "  ✗ $name"; failed+=("$name"); }
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::failed to publish: ${failed[*]}"
            exit 1
          fi
