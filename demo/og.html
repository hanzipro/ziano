<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>og:image 產圖工具 — 1200×630 截圖用，不出貨</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@hanzi.pro/webfonts-shanggu-serif@0.1.0-rc.5/swap.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@hanzi.pro/webfonts-shanggu-sans@0.1.0-rc.5/swap.css" />
  <style>
    /* one-shot artwork: fixed 1200×630 canvas, physical properties fine here */
    * { margin: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #fff;
      color: #1a1a1a;
      font-family: 'Avenir Next', 'Shanggu Sans', sans-serif;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: 56px 72px 48px;
    }
    .specimens {
      align-self: center;
      display: grid;
      row-gap: 8px;
    }
    .specimens p {
      font-size: 150px;
      line-height: 1.15;
      letter-spacing: .12em;
      white-space: nowrap;
    }
    .standard {
      font-family: 'PingFang TC', sans-serif;
      color: #b0b1b3;
    }
    .heritage {
      font-family: 'Shanggu Serif', serif;
      font-weight: 480;
    }
    footer {
      display: flex;
      align-items: baseline;
      gap: 28px;
      border-top: 6px solid #b00404;
      padding-top: 28px;
    }
    .wordmark {
      font-size: 44px;
      font-weight: 200;
      letter-spacing: .02em;
    }
    .wordmark small {
      font-size: .675em;
      opacity: .5;
    }
    .tagline {
      font-size: 30px;
      font-weight: 500;
    }
    .sub {
      margin-left: auto;
      font-size: 26px;
      color: #696c6b;
    }
  </style>
</head>
<body>
  <section class="specimens">
    <p class="standard">漢骨育北山過</p>
    <p class="heritage">漢骨育北山過</p>
  </section>
  <footer>
    <span class="wordmark"><small>@hanzi.pro/</small>ziano</span>
    <span class="tagline">傳承字形webfont CDN</span>
    <span class="sub">切片載入・毫秒到位</span>
  </footer>
</body>
</html>
