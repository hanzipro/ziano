<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ziano・源樣/源起 差異疊影 diff overlay</title>

  <!-- Two faces stacked in the same grid cell. GenYo = red, Genki = cyan with
       mix-blend-mode:multiply over a white bg:
         both agree → red×cyan = black     GenYo only → red     Genki only → cyan
       So black = identical, coloured fringe = where the 斷筆 treatment diverges. -->
  <style>
    @font-face { font-family: 'GenYoMin'; src: url('/genki-test/GenYoMin2TW-L.otf')  format('opentype'); font-weight: 300; font-display: swap; }
    @font-face { font-family: 'GenYoMin'; src: url('/genki-test/GenYoMin2TW-SB.otf') format('opentype'); font-weight: 600; font-display: swap; }
    @font-face { font-family: 'GenKiMin'; src: url('/genki-test/GenKiMin2TW-L.otf')  format('opentype'); font-weight: 300; font-display: swap; }
    @font-face { font-family: 'GenKiMin'; src: url('/genki-test/GenKiMin2TW-SB.otf') format('opentype'); font-weight: 600; font-display: swap; }
    @font-face { font-family: 'GenYoGothic'; src: url('/genki-test/GenYoGothic2TW-L.otf') format('opentype'); font-weight: 300; font-display: swap; }
    @font-face { font-family: 'GenYoGothic'; src: url('/genki-test/GenYoGothic2TW-B.otf') format('opentype'); font-weight: 700; font-display: swap; }
    @font-face { font-family: 'GenKiGothic'; src: url('/genki-test/GenKiGothic2TW-L.otf') format('opentype'); font-weight: 300; font-display: swap; }
    @font-face { font-family: 'GenKiGothic'; src: url('/genki-test/GenKiGothic2TW-B.otf') format('opentype'); font-weight: 700; font-display: swap; }

    :root { --ink:#1a1a1a; --paper:#fbfbf9; --line:#d8d4cc; --accent:#9a3b34; --w:300; --size:4rem; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding-block: 1.5rem 4rem; padding-inline: clamp(1rem, 3vw, 2.5rem);
      background: var(--paper); color: var(--ink); font-family: system-ui, sans-serif; line-height: 1.6;
    }
    h1 { font-size: 1.3rem; margin-block: 0 .25rem; }
    .lede { margin-block: 0 1rem; color: #555; max-inline-size: 70ch; }
    .legend { display: inline-flex; gap: 1rem; font-size: .85rem; margin-inline-start: .5rem; }
    .legend b { font-weight: 600; }
    .legend .r { color: #e10000; } .legend .c { color: #00a3a3; } .legend .k { color: #000; }

    form.controls {
      display: flex; flex-wrap: wrap; gap: 1rem 2rem; align-items: center;
      padding: .9rem 1.1rem; border: 1px solid var(--line); border-radius: .5rem;
      background: #fff; position: sticky; inset-block-start: 0; z-index: 1; margin-block: 1rem;
    }
    form.controls label { display: inline-flex; gap: .45rem; align-items: center; font-size: .9rem; }
    fieldset { border: 0; padding: 0; margin: 0; display: inline-flex; gap: .9rem; }
    output { font-variant-numeric: tabular-nums; min-inline-size: 3ch; color: var(--accent); }

    /* the overlay */
    .stack {
      display: grid; background: #fff; border: 1px solid var(--line); border-radius: .5rem;
      padding: 1.2rem 1.1rem;
    }
    .stack > .layer {
      grid-area: 1 / 1;                 /* stack both in one cell */
      margin: 0; font-weight: var(--w); font-size: var(--size);
      line-height: 1.9; text-align: justify; letter-spacing: 0;
    }
    .layer.a { color: #ff0000; }                               /* GenYo */
    .layer.b { color: #00ffff; mix-blend-mode: multiply; }     /* Genki */

    .stack[data-style='serif'] .layer.a { font-family: 'GenYoMin', serif; }
    .stack[data-style='serif'] .layer.b { font-family: 'GenKiMin', serif; }
    .stack[data-style='sans']  .layer.a { font-family: 'GenYoGothic', sans-serif; }
    .stack[data-style='sans']  .layer.b { font-family: 'GenKiGothic', sans-serif; }

    /* solo mode: hide the cyan layer to read one face plainly */
    body:has(#solo:checked) .layer.b { visibility: hidden; }
    body:has(#solo:checked) .layer.a { color: var(--ink); }
  </style>

  <script type="module">
    const root = document.documentElement
    const form = document.querySelector('form.controls')
    const stack = document.querySelector('.stack')

    // The visible 斷筆 difference lives at 撇/捺 junctions: GenYo keeps Source Han's
    // CONNECTED (連筆/楷化) apex; Genki BREAKS it into separate strokes. Biggest at
    // 入八人今令及之言 (~22% pixels differ). 辶 chars change least (~13%).
    const SAMPLE = '入八人今令及之言永　絲線骨體傳承筆畫'

    const WEIGHTS = { serif: [['300','300 (L)'],['600','600 (SB)']], sans: [['300','300 (L)'],['700','700 (B)']] }
    const weightsBox = document.querySelector('#weights')
    let lastWeight = '300', curStyle = ''

    const renderWeights = (
      style,
    ) => {
      const opts = WEIGHTS[style]
      const keep = opts.some(([v]) => v === lastWeight) ? lastWeight : opts[0][0]
      weightsBox.innerHTML = opts
        .map(([v, l]) => `<label><input type="radio" name="weight" value="${v}" ${v === keep ? 'checked' : ''} /> ${l}</label>`)
        .join('')
    }

    const apply = (
    ) => {
      const style = form.style.value
      if (style !== curStyle) { curStyle = style; renderWeights(style); stack.dataset.style = style }
      lastWeight = form.weight.value
      root.style.setProperty('--w', lastWeight)
      root.style.setProperty('--size', `${Number(form.size.value).toFixed(2)}rem`)
      document.querySelector('#size-out').value = Number(form.size.value).toFixed(1)
    }

    stack.innerHTML = `<p class="layer a">${SAMPLE}</p><p class="layer b">${SAMPLE}</p>`
    form.addEventListener('input', apply)
    apply()
  </script>
</head>

<body>
  <h1>源樣 GenYo / 源起 Genki — 差異疊影</h1>
  <p class="lede">
    兩套字疊在同一格、混色相乘。<span class="legend"><b class="k">黑＝完全相同</b><b class="r">紅＝源樣多出</b><b class="c">青＝源起多出</b></span><br />
    <strong>結論：兩者視覺上等同。</strong>86% 字形差在 outline <strong>結構</strong>（源起把思源的連筆<strong>斷成兩段相鄰輪廓</strong> → 墨跡相同 → 疊起來重合），
    這是「字體建構」差異、不是看得出的造形差異。即使放到最大，也只在筆畫<strong>邊緣</strong>看到 ≤1px 的紅／青毛邊，沒有結構性斷裂。
    源起的用途是當源流／源石／源雲／源泉的乾淨衍生基底，而非另一種外觀。
  </p>

  <form class="controls">
    <fieldset>
      <label><input type="radio" name="style" value="serif" checked /> 明體</label>
      <label><input type="radio" name="style" value="sans" /> 黑體</label>
    </fieldset>
    <fieldset id="weights"></fieldset>
    <label>字級 <input type="range" name="size" min="2" max="12" step="0.5" value="4" /> <output id="size-out">4.0</output> rem</label>
    <label><input type="checkbox" id="solo" /> 只看源樣（關閉疊影）</label>
  </form>

  <div class="stack"></div>
</body>
</html>
