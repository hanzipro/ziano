# Each [[family]] is one packaged face. Data only — no code.
# format: "vf" (variable, one file spans all weights) | "static" (per-weight)
# style:  "serif" | "sans"  → selects the slice table (data/slices.<style>.json)
# asset:  the GitHub-release asset (a .7z archive of all variants)
# member: the exact font file to extract from the archive
#         → the *無附加名* base variant (ShangguSans-VF / ShangguSerif-VF): the
#           "舊字形增強版" that actively merges 新→舊 異體字 (青→靑, 尚→尙, 兑→兌,
#           温→溫) for maximal 傳承字形. NOT the TC variant — per upstream README,
#           TC is only the "繁體中文標點版" and does NOT merge glyphs.
# license_member: the OFL license file inside the archive
#
# Real values confirmed against the live GuiWonder/Shanggu 1.028 release:
#   - tag is "1.028" (no leading "v")
#   - we pull the *TTF* (glyf VF) .7z archives, NOT the OTF (CFF2) ones.
#     Why: Chrome routes CFF2 to FreeType but glyf/TrueType to the native
#     rasterizer (CoreText/DirectWrite); the FreeType CFF2 path renders ~1.6×
#     thinner, so the CFF2 build looked washed-out/blurry at body sizes in
#     Chrome (Safari was fine — it uses CoreText for everything). glyf renders
#     correctly in both. The base TTF is byte-for-byte the same coverage as the
#     base OTF (44.8k glyphs, identical cmap) and keeps the 舊字形 merges
#     (青→靑 both map to one glyph). Upstream glyf is unhinted (no gasp) — a
#     ttfautohint pass for Windows 1x is a possible future, separate refinement.
#     See memory/cff2-renders-thin-in-browsers.md + demo/ttf-test.html.
#   - the base VF axis is wght 250..900 (not 100..900)
#   - no Reserved Font Name is declared in the OFL → upstream-derived names kept

[[family]]
id              = "shanggu-serif"
font_family     = "Shanggu Serif"          # keep name (spec §7); RFN gate passed
style           = "serif"
format          = "vf"
weight_min      = 250
weight_max      = 900
repo            = "GuiWonder/Shanggu"
release_tag     = "1.028"
asset           = "ShangguSerifVF_TTFs.7z"
member          = "ShangguSerif-VF.ttf"
license_member  = "LICENSE.txt"
asset_sha256    = "36c26a19f159d4e388de115e222fd663dd7d0629d0dba48b289f85a7cd85c399"

[[family]]
id              = "shanggu-sans"
font_family     = "Shanggu Sans"
style           = "sans"
format          = "vf"
weight_min      = 250
weight_max      = 900
repo            = "GuiWonder/Shanggu"
release_tag     = "1.028"
asset           = "ShangguSansVF_TTFs.7z"
member          = "ShangguSans-VF.ttf"
license_member  = "LICENSE.txt"
asset_sha256    = "31b207a05332196ff444114d66de1c7b622d3a7244ec15a2485e8d0844cb1984"

